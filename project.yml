packages:
  - name: default
    functions:
      - name: savelanguagenote
        runtime: python:3.11
        web: true
        environment:
          GOOGLE_SCRIPT_SAVE_URL: "${GOOGLE_SCRIPT_SAVE_URL}"
      - name: listlanguagenotes
        runtime: python:3.11
        web: true
        environment:
          GOOGLE_SCRIPT_LIST_URL: "${GOOGLE_SCRIPT_LIST_URL}"
      - name: deletelanguagenote
        runtime: python:3.11
        web: true
        environment:
          GOOGLE_SCRIPT_DELETE_URL: "${GOOGLE_SCRIPT_DELETE_URL}"
      - name: updatelanguagenote
        runtime: python:3.11
        web: true
        environment:
          GOOGLE_SCRIPT_UPDATE_URL: "${GOOGLE_SCRIPT_UPDATE_URL}"